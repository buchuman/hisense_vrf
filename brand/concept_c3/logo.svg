<?xml version="1.0" encoding="UTF-8"?>
<!--
C3 landscape logo — icon on the left, wordmark on the right.
512×256 viewbox so the shortest side is 256 px at standard resolution
and 512 px at @2x — within the brands repo's allowed range.

The wordmark is a clean sans-serif rendering of "Hisense VRF" — the same
human-readable name used in manifest.json. Not the Hisense corporate logo.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" width="512" height="256">
  <!-- Background tile -->
  <rect x="0" y="0" width="512" height="256" rx="32" fill="#0D47A1"/>

  <!-- ── Icon on the left (re-uses C3 layout, scaled into a 256×256 area) ── -->
  <g transform="translate(0,0)">
    <!-- Outdoor unit -->
    <rect x="24" y="40" width="72" height="48" rx="6" fill="#4FC3F7"/>
    <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
      <line x1="60" y1="52" x2="60" y2="76"/>
      <line x1="48" y1="64" x2="72" y2="64"/>
      <line x1="51" y1="55" x2="69" y2="73"/>
      <line x1="51" y1="73" x2="69" y2="55"/>
    </g>

    <!-- Refrigerant arc to gateway -->
    <path d="M 96 70 Q 116 70 116 96" stroke="#FFC857" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Gateway -->
    <rect x="92" y="96" width="72" height="80" rx="8" fill="#FFFFFF"/>
    <rect x="104" y="108" width="48" height="20" rx="3" fill="#0D47A1"/>
    <g stroke="#4CC3D9" stroke-width="2" stroke-linecap="round">
      <line x1="111" y1="114" x2="111" y2="122"/>
      <line x1="121" y1="114" x2="121" y2="122"/>
      <line x1="135" y1="114" x2="135" y2="122"/>
      <line x1="145" y1="114" x2="145" y2="122"/>
      <line x1="115" y1="118" x2="119" y2="118"/>
      <line x1="139" y1="118" x2="143" y2="118"/>
    </g>
    <g>
      <circle cx="108" cy="140" r="3" fill="#4CC3D9"/>
      <circle cx="118" cy="140" r="3" fill="#FFC857"/>
      <circle cx="128" cy="140" r="3" fill="#4CC3D9" opacity="0.6"/>
      <circle cx="138" cy="140" r="3" fill="#4CC3D9" opacity="0.6"/>
      <circle cx="148" cy="140" r="3" fill="#4CC3D9" opacity="0.6"/>
    </g>
    <rect x="116" y="156" width="24" height="14" rx="2" fill="#0D47A1"/>
    <rect x="120" y="160" width="3" height="6" fill="#4CC3D9"/>
    <rect x="126.5" y="160" width="3" height="6" fill="#4CC3D9"/>
    <rect x="133" y="160" width="3" height="6" fill="#4CC3D9"/>

    <!-- Bus + indoor units -->
    <line x1="128" y1="176" x2="128" y2="196" stroke="#4CC3D9" stroke-width="4" stroke-linecap="round"/>
    <line x1="56" y1="196" x2="200" y2="196" stroke="#4CC3D9" stroke-width="4" stroke-linecap="round"/>
    <line x1="64" y1="196" x2="64" y2="208" stroke="#4CC3D9" stroke-width="3" stroke-linecap="round"/>
    <line x1="128" y1="196" x2="128" y2="208" stroke="#4CC3D9" stroke-width="3" stroke-linecap="round"/>
    <line x1="192" y1="196" x2="192" y2="208" stroke="#4CC3D9" stroke-width="3" stroke-linecap="round"/>
    <rect x="44" y="208" width="40" height="22" rx="4" fill="#FFFFFF"/>
    <rect x="108" y="208" width="40" height="22" rx="4" fill="#FFFFFF"/>
    <rect x="172" y="208" width="40" height="22" rx="4" fill="#FFFFFF"/>
    <g stroke="#0D47A1" stroke-width="2" stroke-linecap="round">
      <line x1="52" y1="216" x2="76" y2="216"/>
      <line x1="52" y1="222" x2="76" y2="222"/>
      <line x1="116" y1="216" x2="140" y2="216"/>
      <line x1="116" y1="222" x2="140" y2="222"/>
      <line x1="180" y1="216" x2="204" y2="216"/>
      <line x1="180" y1="222" x2="204" y2="222"/>
    </g>

    <!-- WiFi accent -->
    <g stroke="#4CC3D9" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6">
      <path d="M 168 32 Q 188 32 188 52"/>
      <path d="M 178 32 Q 188 32 188 42"/>
    </g>
    <circle cx="188" cy="32" r="2" fill="#4CC3D9"/>
  </g>

  <!-- ── Vertical separator ── -->
  <line x1="248" y1="64" x2="248" y2="192" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.25"/>

  <!-- ── Wordmark on the right ── -->
  <g fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="280" y="138" font-size="56" font-weight="700" letter-spacing="-1">Hisense</text>
    <text x="280" y="186" font-size="56" font-weight="300" fill="#4CC3D9" letter-spacing="2">VRF</text>
  </g>
</svg>
