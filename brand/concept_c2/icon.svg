<?xml version="1.0" encoding="UTF-8"?>
<!--
Concept C2 — modern restyle of C
"Outdoor → i-Modkit gateway → indoor units"

Same narrative as C (full VRF + Modbus system in one glyph) but with a flatter,
more contemporary look and a clearly drawn gateway box between the outdoor
unit and the indoor bus. The Modbus controller is no longer implicit — it's
the central element of the composition.

Colour palette (modern, Material-style):
  - Background:    #1976D2 (Material Blue 700 — clean, modern)
  - Outdoor unit:  #FFFFFF
  - Gateway:       #0D47A1 (Material Blue 900 — darker for contrast)
  - Gateway LEDs:  #4CC3D9 (cyan, "active")
  - Refrigerant:   #FFC857 (warm yellow — heat exchange)
  - Indoor units:  #FFFFFF
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect x="0" y="0" width="256" height="256" rx="48" fill="#1976D2"/>

  <!-- Outdoor unit (top, simplified — no fan blades) -->
  <rect x="76" y="28" width="104" height="56" rx="8" fill="#FFFFFF"/>
  <!-- Stylised snowflake/ventilation symbol inside the outdoor unit -->
  <g stroke="#1976D2" stroke-width="3" stroke-linecap="round">
    <line x1="128" y1="42" x2="128" y2="70"/>
    <line x1="114" y1="56" x2="142" y2="56"/>
    <line x1="118" y1="46" x2="138" y2="66"/>
    <line x1="118" y1="66" x2="138" y2="46"/>
  </g>
  <circle cx="128" cy="56" r="3" fill="#1976D2"/>

  <!-- Refrigerant line: outdoor → gateway -->
  <line x1="128" y1="84" x2="128" y2="108" stroke="#FFC857" stroke-width="5" stroke-linecap="round"/>

  <!-- Gateway (i-Modkit) — clearly drawn box in the middle -->
  <rect x="80" y="108" width="96" height="40" rx="6" fill="#0D47A1"/>
  <!-- "Modbus" wordmark hint (3 horizontal LED bars) -->
  <rect x="92" y="118" width="36" height="4" rx="2" fill="#4CC3D9"/>
  <rect x="92" y="126" width="28" height="4" rx="2" fill="#4CC3D9" opacity="0.7"/>
  <rect x="92" y="134" width="32" height="4" rx="2" fill="#4CC3D9" opacity="0.4"/>
  <!-- Status LEDs on the right side -->
  <circle cx="150" cy="120" r="3" fill="#4CC3D9"/>
  <circle cx="160" cy="120" r="3" fill="#4CC3D9" opacity="0.5"/>
  <circle cx="150" cy="136" r="3" fill="#FFC857"/>
  <circle cx="160" cy="136" r="3" fill="#FFC857" opacity="0.5"/>

  <!-- Modbus bus from gateway down + branch -->
  <line x1="128" y1="148" x2="128" y2="172" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="56" y1="172" x2="200" y2="172" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Bus drops to each indoor unit -->
  <line x1="64" y1="172" x2="64" y2="188" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="128" y1="172" x2="128" y2="188" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="192" y1="172" x2="192" y2="188" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Three indoor units (cassette style — square with cross vents) -->
  <g fill="#FFFFFF">
    <rect x="44" y="188" width="40" height="40" rx="6"/>
    <rect x="108" y="188" width="40" height="40" rx="6"/>
    <rect x="172" y="188" width="40" height="40" rx="6"/>
  </g>
  <!-- Cross vents inside each indoor (cassette pattern) -->
  <g stroke="#1976D2" stroke-width="2.5" stroke-linecap="round">
    <line x1="52" y1="208" x2="76" y2="208"/>
    <line x1="64" y1="196" x2="64" y2="220"/>
    <line x1="116" y1="208" x2="140" y2="208"/>
    <line x1="128" y1="196" x2="128" y2="220"/>
    <line x1="180" y1="208" x2="204" y2="208"/>
    <line x1="192" y1="196" x2="192" y2="220"/>
  </g>
</svg>
