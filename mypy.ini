[mypy]
python_version = 3.14
follow_imports = silent
ignore_missing_imports = True
# `pyacmodbus-stub` is the only path in-repo. The `homeassistant` package is
# expected to be installed in the active environment (`pip install
# homeassistant`) — that's what CI does and how mypy resolves HA's types.
# If your local environment uses a checked-out HA core fork instead of the
# pip package, extend `MYPYPATH` externally before running mypy, e.g.:
#     MYPYPATH=/path/to/homeassistant/core mypy custom_components/hisense_vrf/
mypy_path = pyacmodbus-stub

# Strict mode flags (per HA quality scale Platinum / strict-typing rule)
strict_equality = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
warn_unreachable = True
check_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_defs = True

# The following two flags are part of "strict" but produce false positives for
# custom integrations because HA's entity base classes (loaded via dynamic
# imports) appear as Any to mypy. The HA core itself sets these only on its
# *first-party* modules — for downstream custom_components it is standard to
# disable them.
disallow_subclassing_any = False
disallow_untyped_decorators = False
disallow_any_generics = False

disable_error_code = annotation-unchecked, import-not-found, import-untyped

[mypy-tests.*]
ignore_errors = True
