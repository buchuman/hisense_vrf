name: HACS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Re-validate daily — HACS checks (brands, release structure) can start
    # failing from external changes even when the repo itself is untouched.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
