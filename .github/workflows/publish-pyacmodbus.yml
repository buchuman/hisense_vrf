name: Publish pyacmodbus to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Target index"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build the distribution
        working-directory: pyacmodbus-stub
        run: python -m build

      - name: Validate metadata
        working-directory: pyacmodbus-stub
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyacmodbus-dist
          path: pyacmodbus-stub/dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pyacmodbus
    permissions:
      id-token: write   # OIDC trusted publishing — no token needed
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: pyacmodbus-dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    # Auto-publish on GitHub release; manual dispatch also accepted.
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyacmodbus
    permissions:
      id-token: write   # OIDC trusted publishing — no token needed
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: pyacmodbus-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
